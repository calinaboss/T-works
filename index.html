<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="fv.png" sizes="32x32">
    <link rel="apple-touch-icon" href="fv.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Works</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }





        main {
            width: 100%;
            max-width: 800px;
            padding: 80px 20px;
            box-sizing: border-box;
            text-align: left;
        }

        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.2;
        }

    

        footer {
            width: 100%;
            max-width: 800px;
            margin-top: auto;
            padding: 60px 20px 40px 20px;
            box-sizing: border-box;
            border-top: 1px solid #111;
        }

        .contatti {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contatti p {
            margin: 0;
            color: #888;
            font-size: 1rem;
        }

        .contatti span {
            margin: 0;
            color: #ffffff;
            font-size: 1rem;
        }

        .contatti a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        .contatti a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>


    <main>
        <h1 id="testo-principale">hi</h1>
    </main>

    <footer>
        <div class="contatti">
            <p>Email: <span>info@t-works.it</span></p>
            <p>Instagram: <a href="https://instagram.com/tworks.it" target="_blank">@tworks.it</a></p>
           
        </div>
    </footer>

</body>
</html>
