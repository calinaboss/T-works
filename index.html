<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Tiron's website</title>
    <link href="https://repo.techland.gg/css/base.min.css?v=7" rel="stylesheet" />
    <link href="https://dyinglightgame.com/css/style.min.css?v=1782407893" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <style>
        .static-hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-img-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        .bg-img-container img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .content-box {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px; 
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .testo-centrato {
            color: #fff;
            text-align: center;
            max-width: 800px;
            font-size: 2rem;
            line-height: 1.6;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .testo-centrato h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
        }
        .testo-centrato span {
            font-size: 15px;
            text-align: center;
        }
        .btns {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .btn__taped {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn__taped span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .btn__taped i {
            margin-right: 10px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="home windows">
    <div class="stonebackground"></div>
    <header class="home-header">
        <div class="static-hero">
            <div class="bg-img-container">
                <picture>
                    <source srcset="https://dyinglightgame.com/img/rotator/3/bg_575.jpg" media="(max-width: 575px)">
                    <source srcset="https://dyinglightgame.com/img/rotator/3/bg_768.jpg" media="(max-width: 768px)">
                    <source srcset="https://dyinglightgame.com/img/rotator/3/bg_1024.jpg" media="(max-width: 1024px)">
                    <source srcset="https://dyinglightgame.com/img/rotator/3/bg_1299.jpg" media="(max-width: 1299px)">
                    <video class="hero__background-video" data-autoplay muted loop playsinline preload="none"
            poster="https://dyinglightgame.com/wp-content/uploads/2026/09/hero-poster.webp" >
            <source data-src="https://dyinglightgame.com/wp-content/uploads/2026/06/dlg-franchise-bg.mp4"
                type="video/mp4">
        </video> <!-- i just left it like this -->
                </picture>
            </div>
            <div class="content-box">
                <div class="btns">
                    <a href="https://steamcommunity.com/id/tworks/" class="btn__taped btn__taped--transparent">
                        <span><i class="fa-brands fa-steam"></i> Steam</span>
                    </a>
                    <a href="https://open.spotify.com/user/31sz55tzyn7kxlc4fon6vxz5v7xe?si=d01cfd27edbe45cf" class="btn__taped btn__taped--red">
                        <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                    </a>
                    <a href="javascript:void(0)" onclick="navigator.clipboard.writeText('t1ron'); alert('username copied');" class="btn__taped btn__taped--red">
                        <span><i class="fa-brands fa-discord"></i> Discord</span>
                    </a>
                </div>
                <div class="testo-centrato">
                    <p>Hello this is my personal website here u can find some of my links.</p>
                    <p><span>(i got the style and images from techlands website)</span></p>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
